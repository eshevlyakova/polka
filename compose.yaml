services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: polka
      POSTGRES_USER: polka
      POSTGRES_PASSWORD: polka_local_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - polka_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polka -d polka"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  polka_database:
